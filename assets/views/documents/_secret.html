<div class="revealed" data-revealed>
  <p class="mono m-0 {% if field == "recovery" %}whitespace-pre-line{% endif %}" data-secret-value>{{ secret }}</p>
  <div class="countdown"><div class="bar"><span data-countdown-bar style="width: 100%"></span></div><span class="meta tabular-nums" data-countdown-text>Hides in 30s</span></div>
  <div class="mt-2 flex gap-2"><button type="button" class="btn btn-secondary" data-secret-copy-shown>{{<icon name="copy" class="h-4 w-4"/>}}Copy</button><button type="button" class="btn btn-secondary" data-secret-hide>{{<icon name="eye-off" class="h-4 w-4"/>}}Hide now</button></div>
</div>
