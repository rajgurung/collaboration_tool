{% extends "layouts/base.html" %}
{% block body %}
<main class="auth-stage">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <section class="auth-story">
    <div>
      <div class="flex items-center gap-3">{{<logo/>}}<strong class="tracking-[.1em] uppercase">{{ t(key="app-name", lang="en-US") }}</strong></div>
      <h1 class="mt-16 max-w-2xl text-5xl font-medium tracking-[-.05em] md:text-7xl">Every promise has an owner.</h1>
      <p class="mt-6 max-w-xl text-lg leading-8 text-white/50">{{ t(key="app-tagline", lang="en-US") }}</p>
    </div>
  </section>
  <section class="auth-panel">
    <div class="grid w-full max-w-sm gap-3">
      <a href="/signup" class="btn btn-primary h-12">Create an organisation</a>
      <a href="/login" class="btn btn-ghost h-12">Sign in</a>
    </div>
  </section>
</main>
{% endblock body %}
