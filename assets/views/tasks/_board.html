<div id="task-board" class="grid gap-4 md:grid-cols-2 xl:grid-cols-4"
     hx-get="/tasks/board" hx-trigger="board-changed from:body" hx-include="#board-q" hx-swap="outerHTML" hx-disinherit="*">
  <input type="hidden" id="board-q" name="q" value="{{ q }}">
  {% for column in columns %}
  <section class="task-column" aria-label="{{ column.label }}">
    <div class="mb-4 flex items-center justify-between">
      <div class="flex items-center gap-2"><span class="h-2 w-2 rounded-full" style="background: {{ column.color }}"></span><h2 class="font-medium">{{ column.label }}</h2></div>
      <span class="count-badge">{{ column.cards | length }}</span>
    </div>
    <div class="space-y-3">
      {% for card in column.cards %}
      <article class="task-card" id="task-{{ card.id }}">
        <div class="mb-4 flex items-start justify-between gap-3">
          <span class="priority priority-{{ card.priority }}">{{ card.priority }}</span>
          {% if card.owner %}{{<avatar name={card.owner} color={card.owner_color} small={true}/>}}{% else %}<span class="text-xs text-white/30">Unassigned</span>{% endif %}
        </div>
        <h3 class="text-[15px] font-medium leading-6 text-white/80">{{ card.title }}</h3>
        <p class="mt-2 text-xs text-white/30">{{ card.project }}</p>
        <div class="mt-5 flex flex-wrap items-center justify-between gap-2 border-t border-white/7 pt-4">
          <button type="button" class="flex items-center gap-1.5 whitespace-nowrap rounded-full px-2 py-1 text-xs text-white/40 hover:bg-white/7 hover:text-white"
                  hx-get="/tasks/{{ card.id }}" hx-target="#task-sheet-body"
                  hx-on::after-request="document.getElementById('task-sheet').showModal()">
            {{<icon name="message-circle" class="h-3.5 w-3.5"/>}}{% if card.notes %}{{ card.notes }}{% else %}Add note{% endif %}
          </button>
          <span class="flex items-center gap-1.5 whitespace-nowrap text-xs text-white/35">{{<icon name="clock-3" class="h-3.5 w-3.5"/>}}{{ card.due }}</span>
          <form method="post" action="/tasks/{{ card.id }}/status" hx-post="/tasks/{{ card.id }}/status" hx-target="#task-board" hx-swap="outerHTML" hx-trigger="change">
            <input type="hidden" name="q" value="{{ q }}">
            <select name="status" aria-label="Change status of {{ card.title }}" class="rounded-lg border border-white/10 bg-transparent px-1.5 py-1 text-xs text-white/50">
              {% for s in statuses %}<option value="{{ s.key }}" {% if s.key == card.status %}selected{% endif %}>{{ s.label }}</option>{% endfor %}
            </select>
            <noscript><button type="submit" class="btn btn-ghost btn-sm">Move</button></noscript>
          </form>
        </div>
      </article>
      {% else %}
      <p class="rounded-2xl border border-dashed border-white/10 p-5 text-center text-sm text-white/30">Nothing here.</p>
      {% endfor %}
    </div>
  </section>
  {% endfor %}
</div>
