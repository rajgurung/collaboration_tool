<div class="list-row flex-wrap" data-member-row id="member-{{ row.id }}">
  {{<avatar name={row.username} color={row.color} size="md"/>}}
  <div class="min-w-0 flex-1">
    <p class="truncate-1 m-0 font-medium">{{ row.username }}{% if row.is_me %} <span class="text-muted">(you)</span>{% endif %}</p>
    <p class="meta truncate-1 m-0">{{ row.email }}</p>
  </div>
  {% if me.role == "owner" and row.role != "owner" %}
  <form method="post" action="/members/{{ row.id }}/role" hx-post="/members/{{ row.id }}/role" hx-target="#member-{{ row.id }}" hx-swap="outerHTML" class="flex items-center gap-2">
    <select name="role" class="input min-h-9 w-auto py-1 text-sm" aria-label="Role for {{ row.username }}">
      <option value="member" {% if row.role == "member" %}selected{% endif %}>Member</option>
      <option value="admin" {% if row.role == "admin" %}selected{% endif %}>Admin</option>
    </select>
    <button type="submit" class="btn btn-secondary">Save</button>
  </form>
  {% else %}
  <span class="pill capitalize">{{ row.role }}</span>
  {% endif %}
</div>
