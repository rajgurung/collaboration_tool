<form id="project-form" method="post" data-close-on-success
      action="{% if project_id %}/roadmap/projects/{{ project_id }}{% else %}/roadmap/projects{% endif %}"
      hx-post="{% if project_id %}/roadmap/projects/{{ project_id }}{% else %}/roadmap/projects{% endif %}"
      class="grid gap-4">
  <div>
    <h2 class="m-0 text-xl font-semibold">{% if project_id %}Edit project{% else %}New project{% endif %}</h2>
    <p class="meta mt-1 mb-0 text-sm">A workstream on the roadmap, with one owner.</p>
  </div>
  {{<text_field name="name" label="Name" value={form.name} error={errors.name | default(value="")}/>}}
  <div class="grid gap-4 sm:grid-cols-3">
    <label class="field">
      <span class="field-label">Lane</span>
      <select name="lane" class="input">
        {% for lane in lanes %}<option value="{{ lane }}" {% if form.lane == lane %}selected{% endif %}>{{ lane | capitalize }}</option>{% endfor %}
      </select>
      {% if errors.lane %}<span class="field-error">{{ errors.lane }}</span>{% endif %}
    </label>
    {{<text_field name="status" label="Status" value={form.status} error={errors.status | default(value="")}/>}}
    <label class="field">
      <span class="field-label">Owner</span>
      <select name="owner_id" class="input">
        <option value="">Unassigned</option>
        {% for person in team %}<option value="{{ person.id }}" {% if form.owner_id == person.id | str %}selected{% endif %}>{{ person.username }}</option>{% endfor %}
      </select>
      {% if errors.owner_id %}<span class="field-error">{{ errors.owner_id }}</span>{% endif %}
    </label>
  </div>
  <fieldset class="field m-0 border-0 p-0">
    <legend class="field-label mb-2">Colour</legend>
    <div class="flex flex-wrap gap-3">
      {% for accent in accents %}
      <label class="cursor-pointer">
        <input type="radio" name="accent" value="{{ accent }}" class="peer sr-only" {% if form.accent == accent %}checked{% endif %}>
        <span class="block h-9 w-9 rounded-full ring-offset-2 ring-offset-surface peer-checked:ring-2 peer-checked:ring-text peer-focus-visible:ring-2" style="background: {{ accent }}" title="{{ accent }}"></span>
      </label>
      {% endfor %}
    </div>
    {% if errors.accent %}<span class="field-error">{{ errors.accent }}</span>{% endif %}
  </fieldset>
  <label class="field">
    <span class="field-label">Summary</span>
    <textarea name="summary" class="input" rows="3">{{ form.summary }}</textarea>
    {% if errors.summary %}<span class="field-error">{{ errors.summary }}</span>{% endif %}
  </label>
  <div class="flex justify-end gap-2">
    <button type="button" class="btn btn-secondary" data-dialog-close>Cancel</button>
    <button type="submit" class="btn btn-primary">{% if project_id %}Save project{% else %}Add project{% endif %}</button>
  </div>
</form>
