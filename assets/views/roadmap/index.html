{% extends "layouts/app.html" %}
{% block title %}Roadmap · {{ org.name }}{% endblock title %}
{% block content %}
<section class="space-y-5">
  <div class="flex flex-col justify-between gap-5 py-3 md:flex-row md:items-end">
    {{<page_header eyebrow="Roadmap" title="The path ahead" description="What the team is building now, what comes next, and what can wait."/>}}
    <button type="button" class="btn btn-primary self-start md:self-auto"
            hx-get="/roadmap/projects/new" hx-target="#project-dialog-body"
            hx-on::after-request="document.getElementById('project-dialog').showModal()">
      {{<icon name="plus"/>}}New project
    </button>
  </div>
  {% include "roadmap/_lanes.html" %}
</section>
<dialog id="project-dialog" class="modal" aria-label="Project">
  <div id="project-dialog-body"></div>
</dialog>
{% endblock content %}
