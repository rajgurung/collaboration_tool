{% extends "layouts/app.html" %}
{% block title %}Roadmap · {{ org.name }}{% endblock title %}
{% block heading %}Roadmap{% endblock heading %}
{% block actions %}
<button type="button" class="btn btn-primary"
        hx-get="/roadmap/projects/new" hx-target="#project-dialog-body"
        hx-on::after-request="document.getElementById('project-dialog').showModal()">{{<icon name="plus" class="h-4 w-4"/>}}Project</button>
{% endblock actions %}
{% block content %}
{% include "roadmap/_lane.html" %}
<dialog id="project-dialog" class="sheet" aria-label="Project"><div class="sheet-handle"></div><div id="project-dialog-body" class="sheet-body"></div></dialog>
{% endblock content %}
