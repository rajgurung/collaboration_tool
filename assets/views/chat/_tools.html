{# Desktop hover toolbar: the six reactions, one click each, and Reply in thread on a top-level message in the main feed. Hidden on touch screens, where a tap opens the sheet instead. #}
<div class="msg-tools" role="toolbar" aria-label="Message actions">{% include "chat/_tool_picks.html" %}{% if message.can_reply %}<span class="msg-tools-sep" aria-hidden="true"></span><a class="msg-tools-reply" href="{{ org_url(path="/chat/" ~ (message.conversation_id) ~ "/threads/" ~ (message.id) ~ "?reply=1") }}">{{<icon name="message-square-reply" class="h-[18px] w-[18px]"/>}}Reply in thread</a>{% endif %}</div>
