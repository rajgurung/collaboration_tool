{# Who has read one of your messages. Live updates replace it by id. #}
<span class="msg-receipt{% if message.receipt and message.receipt.all %} msg-receipt-all{% endif %}" id="receipt-{{ message.id }}"{% if oob | default(value=false) %} hx-swap-oob="true"{% endif %}>{% if message.receipt %}<button type="button" class="msg-receipt-btn" title="Read by {{ message.receipt.readers | join(sep=", ") }}" data-toggle="#receipt-names-{{ message.id }}">{{<icon name="check-check" class="h-3.5 w-3.5"/>}}{{ message.receipt.text }}</button><span id="receipt-names-{{ message.id }}" class="msg-receipt-names hidden">{{ message.receipt.readers | join(sep=", ") }}</span>{% endif %}</span>
