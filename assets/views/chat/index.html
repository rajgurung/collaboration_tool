{% extends "layouts/app.html" %}
{% block title %}Chat · {{ org.name }}{% endblock title %}
{% block main %}
<div class="chat-layout">
  <div class="chat-list-pane">
    {% include "chat/_list.html" %}
  </div>
  <div class="hidden place-items-center p-8 text-center text-muted min-[900px]:grid">
    <div>{{<icon name="messages-square" class="mx-auto h-9 w-9"/>}}<p class="mt-3">Choose a conversation</p></div>
  </div>
</div>
<dialog id="chat-dialog" class="sheet" aria-label="Chat"><div class="sheet-handle"></div><div id="chat-dialog-body" class="sheet-body"></div></dialog>
{% endblock main %}
