{# The toolbar's six reactions. Live updates replace them by id; Reply in thread stays put. #}
<span class="tool-picks" id="tools-{{ message.id }}" aria-live="off"{% if oob | default(value=false) %} hx-swap-oob="true"{% endif %}>{% for p in message.picks %}<button type="button"{% if p.mine %} class="mine"{% endif %} data-react data-emoji="{{ p.emoji }}" data-message="{{ message.id }}" data-url="/chat/{{ message.conversation_id }}/messages/{{ message.id }}/reactions" aria-pressed="{% if p.mine %}true{% else %}false{% endif %}" title="{% if p.mine %}Remove your {{ p.emoji }}{% else %}React {{ p.emoji }}{% endif %}"><span class="emoji" aria-hidden="true">{{ p.emoji }}</span><span class="sr-only">{% if p.mine %}Remove your {{ p.emoji }}{% else %}React {{ p.emoji }}{% endif %}</span></button>{% endfor %}</span>
